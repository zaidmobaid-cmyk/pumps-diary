<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>SquadWatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
  <script src="views.js" defer></script>
  <script src="views-admin.js" defer></script>
</head>
<body class="chrome-hidden">
  <div id="app">
    <aside id="sidebar" aria-label="Main navigation"></aside>
    <div id="shell">
      <header id="topbar"></header>
      <div id="conn-banner" class="conn-banner hidden">live updates reconnecting&hellip;</div>
      <main id="main"></main>
    </div>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>
  <div id="popover-root"></div>

</html>
